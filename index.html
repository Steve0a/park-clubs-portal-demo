<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Park University | Clubs & Organizations</title>
<style>
:root{--burg:#861d38;--mag:#a90553;--gold:#f5a81c;--bg:#f3f4f6;--ink:#252b34;--muted:#667085}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 "Segoe UI",Arial,sans-serif;color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{background:var(--burg);color:white;padding:10px max(22px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;font-size:12px}
.nav{background:white;border-bottom:1px solid #ddd}.navin{max-width:1100px;margin:auto;padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.brand{color:var(--burg);font-weight:800;letter-spacing:.3px}.brand small{display:block;color:#555;font-weight:400;letter-spacing:0}
.links{display:flex;gap:18px;flex-wrap:wrap}.links button{border:0;background:none;color:#555;font-size:13px}
main{max-width:1100px;margin:auto;padding:20px 20px 55px}.crumb{color:var(--muted);font-size:12px}
.hero{background:var(--burg);color:white;padding:28px 32px;margin:17px 0 22px}.hero h1{font-size:29px;margin:0 0 5px}.hero p{margin:0;color:#ffeaf0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}.step{background:white;border-top:4px solid #d1d5db;padding:12px;font-weight:600;font-size:13px}.step.active{border-top-color:var(--mag)}.step span{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.panel{background:white;padding:23px;margin:12px 0;border:1px solid #e7e7e7}.panel h2{font-size:21px;margin:0 0 8px}.muted{color:var(--muted)}
.cards,.two{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{background:white;border-top:5px solid #9d2349;padding:18px;display:flex;flex-direction:column;gap:8px}.card h3{color:var(--burg);font-size:17px;margin:0}.card p{flex:1;margin:0}.tag{color:var(--muted);text-transform:uppercase;font-size:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--burg);background:var(--burg);color:white;padding:9px 14px;border-radius:2px;font-weight:600;font-size:13px;text-decoration:none;display:inline-block}.btn.alt{background:white;color:var(--burg)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold)}
.field{width:100%;padding:11px;border:1px solid #aab0b9;background:white;color:var(--ink);margin:5px 0 14px}label{font-weight:600;display:block;font-size:13px}
.check{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #eee}.check input{accent-color:var(--mag);width:19px;height:19px;margin-top:3px}
.bar{height:9px;background:#e5e7eb;margin:10px 0 20px}.fill{height:100%;background:var(--mag);width:0}
.notice{background:#fff6df;border-left:4px solid var(--gold);padding:13px;margin:15px 0}.success{background:#e7f5ec;border-left:4px solid #20834b;padding:13px;margin:15px 0}
.resource{display:inline-block;margin:6px 15px 6px 0;color:var(--burg);text-decoration:underline}
.footer{max-width:1100px;margin:auto;padding:20px;color:var(--muted);font-size:12px}
@media(max-width:650px){.cards,.two{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:23px}}
</style></head>
<body><div class="top"><strong>SharePoint</strong><span>Search this site</span></div>
<div class="nav"><div class="navin"><div class="brand">PARK UNIVERSITY<small>Student Clubs &amp; Organizations</small></div><div class="links"><button data-nav="home">Home</button><button data-nav="discover">Explore Clubs</button><button data-nav="home">Student Leadership</button><button data-nav="decide">Get Involved</button></div></div></div>
<main><div class="crumb">Home / Get Involved / Start or Join a Club</div>
<div class="hero"><h1>Find your community at Park</h1><p>Explore organizations, connect with club leaders, or bring your club idea to life.</p></div>
<div class="steps" id="steps"></div><div id="screen" aria-live="polite"></div></main>
<div class="footer">PARK UNIVERSITY · STUDENT CLUBS &amp; ORGANIZATIONS</div>
<script>
"use strict";
const clubs=[["PSGA", "Student Leadership", "Student government and funding for student organizations."], ["PSAB", "Student Leadership", "Plans campus events and student experiences."], ["Residence Hall Council", "Student Leadership", "Represents residential students."], ["Park International Club", "International Focus", "Celebrates cultures and builds global connections."], ["Phi Epsilon Kappa", "Program / Subject Area", "Sport and exercise education, networking and professional development."], ["ACM Club", "Program / Subject Area", "Computing and technology interests."], ["Gardening Club", "Program / Subject Area", "Gardening, nature and community."], ["Art Club", "Program / Subject Area", "Creative expression and community."], ["Athletes In Christ", "Religious / Spiritual", "Faith-based student organization."], ["Run Club", "Social / Service / Leadership", "Running, healthy living and community."], ["Black Student Union", "Social / Service / Leadership", "Community, cultural identity and inclusion."], ["Photography Club", "Social / Service / Leadership", "Photography, portfolios and community."], ["Speech and Debate", "Social / Service / Leadership", "Public speaking and debate skills."], ["The Guild Club", "Social / Service / Leadership", "Roleplaying games and relaxation."]];
const tasks=[["Define your club","Name, purpose and proposed activities"],["Identify student leadership","Confirm president and other required officers"],["Confirm a faculty or staff advisor","Collect advisor name and Park email"],["Prepare constitution and bylaws","Have both documents ready"],["Complete the certification form","Submit the official application and required documents"]];
let stage="home",query="",selected="",checks=[false,false,false,false,false],requests=[],apps=[],notice="";
const screen=document.getElementById("screen");
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function btn(label,action,alt=false){return `<button type="button" class="btn ${alt?"alt":""}" data-action="${escapeHTML(action)}">${label}</button>`}
function go(s){stage=s;notice="";render();window.scrollTo(0,0)}
function render(){
const ix=stage==="discover"?0:["decide","join"].includes(stage)?1:stage==="prepare"?2:stage==="submit"?3:0;
document.getElementById("steps").innerHTML=["Discover|Search clubs","Decide|Join or start","Prepare|Checklist","Submit|Review"].map((x,i)=>`<div class="step ${ix===i?"active":""}">${String(i+1).padStart(2,"0")} · ${x.split("|")[0]}<span>${x.split("|")[1]}</span></div>`).join("");
if(stage==="home")screen.innerHTML=`<div class="panel"><h2>What would you like to do?</h2><p class="muted">Search existing organizations before starting a new club.</p><div class="actions" style="margin-top:15px">${btn("Explore Existing Clubs →","discover")}${btn("I Have a Club Idea","decide",true)}</div></div>`;
if(stage==="discover")screen.innerHTML=`<div class="panel"><h2>Step 1 — Explore existing clubs</h2><p class="muted">Search by club name, category or interest.</p><label for="search">Search clubs</label><input id="search" class="field" placeholder="Search clubs, interests or activities..." value="${escapeHTML(query)}"><div class="actions" style="justify-content:space-between"><span class="muted" id="count"></span>${btn("No match? Continue →","decide",true)}</div></div><div class="cards" id="results"></div>`;
if(stage==="decide")screen.innerHTML=`<div class="panel"><h2>Step 2 — Choose your pathway</h2><p class="muted">Found a similar organization? Consider contacting its leadership before starting a new one.</p></div><div class="two"><div class="card"><h3>Join an Existing Club</h3><p>Connect with the leadership of an organization that matches your interests.</p>${btn("Request to Join →","join")}</div><div class="card"><h3>Start a New Club</h3><p>Follow the requirements for forming and certifying a new organization.</p>${btn("Start My Checklist →","prepare")}</div></div>`;
if(stage==="join")screen.innerHTML=`<div class="panel"><h2>Request to Join a Club</h2><p class="muted">This form demonstrates the membership interest workflow. It does not send messages or save requests to Park University.</p><form id="joinform"><label for="joinclub">Organization</label><select id="joinclub" class="field" name="club" required><option value="">Select a club</option>${clubs.map(c=>`<option value="${escapeHTML(c[0])}" ${c[0]===selected?"selected":""}>${escapeHTML(c[0])}</option>`).join("")}</select><label for="joinname">Your name</label><input id="joinname" class="field" name="name" required placeholder="Full name"><label for="joinemail">Park email</label><input id="joinemail" class="field" name="email" type="email" required placeholder="student@park.edu"><label for="joinmessage">Message (optional)</label><textarea id="joinmessage" class="field" name="message" rows="3" placeholder="Why are you interested?"></textarea><div class="actions"><button class="btn" type="submit">Send Interest Request</button>${btn("Back","decide",true)}</div></form>${notice?`<div class="success">${escapeHTML(notice)}</div>`:""}</div>`;
if(stage==="prepare")screen.innerHTML=`<div class="panel"><h2>Step 3 — Your New Club Checklist</h2><p class="muted">Prepare the required information and documents before submitting.</p><strong id="progressLabel"></strong><div class="bar"><div class="fill" id="progressFill"></div></div>${tasks.map((t,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${checks[i]?"checked":""}><span><strong>${escapeHTML(t[0])}</strong><br><span class="muted" style="font-weight:400">${escapeHTML(t[1])}</span></span></label>`).join("")}<h3 style="margin-top:22px">Useful Resources</h3><a class="resource" href="https://form.jotform.com/ParkUniversity/club_certification" target="_blank" rel="noopener noreferrer">Club Certification ↗</a><a class="resource" href="https://canvas.park.edu/courses/33101" target="_blank" rel="noopener noreferrer">Student Org Canvas ↗</a><a class="resource" href="https://my.park.edu/ICS/Campus_Life/" target="_blank" rel="noopener noreferrer">Campus Life Tab ↗</a><div class="notice">Checking these boxes does not submit or certify your club. Complete the official certification form and wait for Student Life review.</div><div class="actions"><a class="btn" href="https://form.jotform.com/ParkUniversity/club_certification" target="_blank" rel="noopener noreferrer">Open Certification Form ↗</a>${btn("View Tracking Stage →","submit",true)}</div></div>`;
if(stage==="submit")screen.innerHTML=`<div class="panel"><h2>Step 4 — Application &amp; Review</h2><p class="muted">The live SharePoint portal would show verified submissions and Student Life review status.</p><div class="notice">This form creates a temporary example record in this browser tab only. It does not submit a real club application.</div><form id="appform"><label for="appclub">Proposed club name</label><input id="appclub" class="field" name="club" required placeholder="e.g., Student Athletes Network"><label for="appname">Applicant name</label><input id="appname" class="field" name="name" required><label for="appemail">Park email</label><input id="appemail" class="field" name="email" type="email" required><button class="btn" type="submit">Create Example Tracking Record</button></form><div id="appRecords"></div><details style="margin-top:20px;border-top:1px solid #ddd;padding-top:12px"><summary style="font-weight:700;color:#861d38;cursor:pointer">Student Life administration preview</summary><p class="muted">For a live system, this section must be staff-only and protected by Microsoft 365 permissions.</p><div id="adminRecords"></div></details></div>`;
if(stage==="discover")updateResults();if(stage==="prepare")updateProgress();if(stage==="submit")updateApps();
}
function updateResults(){const matches=clubs.filter(c=>c.join(" ").toLowerCase().includes(query.toLowerCase()));document.getElementById("count").textContent=matches.length+" matching organizations";document.getElementById("results").innerHTML=matches.map((c,i)=>`<div class="card"><span class="tag">${escapeHTML(c[1])}</span><h3>${escapeHTML(c[0])}</h3><p>${escapeHTML(c[2])}</p><div class="actions">${btn("View Details","details:"+clubs.indexOf(c),true)}${btn("I'm Interested","pick:"+clubs.indexOf(c))}</div></div>`).join("")||'<div class="panel">No matching organizations found. Try a different search or continue to the new-club checklist.</div>'}
function updateProgress(){const n=checks.filter(Boolean).length;document.getElementById("progressLabel").textContent=n+" of 5 steps complete ("+(n*20)+"%)";document.getElementById("progressFill").style.width=(n*20)+"%"}
function updateApps(){document.getElementById("appRecords").innerHTML=apps.map(a=>`<div class="panel" style="background:#f3f4f6"><strong>${escapeHTML(a.club)}</strong><p class="muted">Applicant: ${escapeHTML(a.name)}</p><span style="background:#fce8ef;color:#861d38;padding:5px 9px;font-size:12px">${escapeHTML(a.status)}</span></div>`).join("");document.getElementById("adminRecords").innerHTML=apps.map((a,i)=>`<div style="border-bottom:1px solid #ddd;padding:12px 0"><strong>${escapeHTML(a.club)}</strong><select class="field" data-status="${i}">${["Draft — example","Submitted — example","Under Review — example","Changes Requested — example","Approved — example","Not Approved — example"].map(s=>`<option ${a.status===s?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")+`<p class="muted">${requests.length} example club interest request(s) in this tab.</p>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action],[data-nav]");if(!b)return;const a=b.dataset.action||b.dataset.nav;if(a.startsWith("pick:")){selected=clubs[Number(a.slice(5))][0];go("join")}else if(a.startsWith("details:")){const c=clubs[Number(a.slice(8))];window.alert(c[0]+"\n\n"+c[2]+"\n\nIn SharePoint, this opens a club profile with contact and membership information.")}else go(a)});
document.addEventListener("input",e=>{if(e.target.id==="search"){query=e.target.value;updateResults()}});
document.addEventListener("change",e=>{if(e.target.dataset.check!==undefined){checks[Number(e.target.dataset.check)]=e.target.checked;updateProgress()}if(e.target.dataset.status!==undefined){apps[Number(e.target.dataset.status)].status=e.target.value;updateApps()}});
document.addEventListener("submit",e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(e.target.id==="joinform"){requests.push(d);notice="Example request recorded in this tab. In SharePoint, Power Automate would notify club leaders.";render()}else if(e.target.id==="appform"){apps.push({...d,status:"Draft — example"});render()}});
render();
</script></body></html>
